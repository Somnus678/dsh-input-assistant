name: Publish to npm

# Publishes the current package.json version to the npm registry.
# Triggered by:
#   - pushing a v* tag (normal release flow)
#   - manual dispatch (Actions page / API), e.g. to publish an already
#     versioned but not-yet-on-npm release
# Requires the repository secret NPM_TOKEN (a granular npm token with
# Read and write on packages).

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Cancel superseded runs on the same ref.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release artifact
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish validated artifact
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Check release tag matches package version
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json','utf8')); if(process.env.GITHUB_REF_TYPE==='tag' && process.env.GITHUB_REF_NAME!=='v'+p.version) throw new Error('Release tag must match package.json version');"

      - name: Download tested package
        uses: actions/download-artifact@v4
        with:
          name: dsh-input-assistant-tgz
          path: dist

      - name: Publish
        run: pnpm publish dist/dsh-input-assistant-*.tgz --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
